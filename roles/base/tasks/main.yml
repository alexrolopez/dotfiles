- name: Detect WSL
  set_fact:
    dotfiles_is_wsl: "{{ (ansible_facts['kernel'] | lower) is search('microsoft|wsl') }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Set Debian package architecture
  set_fact:
    dotfiles_debian_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else ansible_facts['architecture'] }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Set upstream Debian package distribution
  set_fact:
    dotfiles_debian_upstream_distribution: "{{ 'debian' if ansible_facts['distribution'] == 'Debian' else 'ubuntu' }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure apt keyring directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add OpenTofu GPG key
  get_url:
    url: https://get.opentofu.org/opentofu.gpg
    dest: /etc/apt/keyrings/opentofu.gpg
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Download OpenTofu repository GPG key
  get_url:
    url: https://packages.opentofu.org/opentofu/tofu/gpgkey
    dest: /tmp/opentofu-repo.gpgkey
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"

- name: Dearmor OpenTofu repository GPG key
  command: gpg --no-tty --batch --yes --dearmor -o /etc/apt/keyrings/opentofu-repo.gpg /tmp/opentofu-repo.gpgkey
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Ensure OpenTofu repository GPG key is readable
  file:
    path: /etc/apt/keyrings/opentofu-repo.gpg
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add OpenTofu repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dotfiles_debian_arch }} signed-by=/etc/apt/keyrings/opentofu.gpg,/etc/apt/keyrings/opentofu-repo.gpg] https://packages.opentofu.org/opentofu/tofu/any/ any main"
    state: present
    filename: opentofu
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add Redis GPG key
  get_url:
    url: https://packages.redis.io/gpg
    dest: /etc/apt/keyrings/redis-archive-keyring.asc
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add Redis repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/redis-archive-keyring.asc] https://packages.redis.io/deb {{ ansible_facts['distribution_release'] }} main"
    state: present
    filename: redis
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add Docker GPG key
  get_url:
    url: "https://download.docker.com/linux/{{ dotfiles_debian_upstream_distribution }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dotfiles_debian_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ dotfiles_debian_upstream_distribution }} {{ ansible_facts['distribution_release'] }} stable"
    state: present
    filename: docker
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add GitHub CLI GPG key
  get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ dotfiles_debian_arch }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    state: present
    filename: github-cli
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add mise GPG key
  get_url:
    url: https://mise.jdx.dev/gpg-key.pub
    dest: /etc/apt/keyrings/mise-archive-keyring.asc
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add mise repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/mise-archive-keyring.asc] https://mise.jdx.dev/deb stable main"
    state: present
    filename: mise
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add eza GPG key
  get_url:
    url: https://raw.githubusercontent.com/eza-community/eza/main/deb.asc
    dest: /etc/apt/keyrings/gierens.asc
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Add eza repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/gierens.asc] http://deb.gierens.de stable main"
    state: present
    filename: gierens
  when: ansible_facts['os_family'] == "Debian"
  become: yes

