    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Install WSL packages
  apt:
    name:
      - wslu
    state: latest
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian" and dotfiles_is_wsl
  become: yes

- name: Enable systemd in WSL
  blockinfile:
    path: /etc/wsl.conf
    create: yes
    mode: '0644'
    marker: "# {mark} ANSIBLE MANAGED BLOCK - dotfiles"
    block: |
      [boot]
      systemd=true
  when: ansible_facts['os_family'] == "Debian" and dotfiles_is_wsl
  become: yes

- name: Install Starship on Debian
  shell: mise use -g starship@latest
  args:
    executable: /bin/bash
  when: ansible_facts['os_family'] == "Debian"

- name: Define macOS brew packages
  set_fact:
    dotfiles_brew_packages:
      - actionlint
      - age
      - ansible
      - autoconf
      - awscli
      - aws-vault
      - bat
      - colima
      - coreutils
      - difftastic
      - direnv
      - dive
      - docker
      - docker-buildx
      - docker-compose
      - eza
      - fd
      - font-fira-code-nerd-font
      - fzf
      - gawk
      - gh
      - ghostty
      - gmp
      - gnupg
      - go
      - go-task
      - hadolint
      - htop
      - jj
      - jq
      - lazydocker
      - libffi
      - libpq
      - libtool
      - libyaml
      - make
      - memcached
      - mise
      - ncurses
      - neovim
      - openssl@3
      - pgcli
      - postgresql@17
      - pnpm
      - pre-commit
      - python
      - readline
      - redis
      - ripgrep
      - rust
      - semgrep
      - shellcheck
      - sops
      - sqlite3
      - starship
      - opentofu
      - tcl-tk
      - tlrc
      - tmux
      - trash
      - tree
      - wget
      - xz
      - zlib
  when: ansible_facts['os_family'] == "Darwin"

- name: Update homebrew on macOS
  shell: brew update
  args:
    executable: /bin/bash
  environment:
    PATH: "/usr/local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"
  when: ansible_facts['os_family'] == "Darwin"

- name: Install brew packages on macOS
  shell: brew install {{ dotfiles_brew_packages | join(' ') }}
  args:
    executable: /bin/bash
  environment:
    PATH: "/usr/local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"
  when: ansible_facts['os_family'] == "Darwin"

- name: Upgrade brew packages on macOS
  shell: brew upgrade {{ dotfiles_brew_packages | join(' ') }}
  args:
    executable: /bin/bash
  environment:
    PATH: "/usr/local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"
  when: ansible_facts['os_family'] == "Darwin"

- name: Check if session-manager-plugin is installed (macOS)
  stat:
    path: /usr/local/sessionmanagerplugin/bin/session-manager-plugin
  register: smp_installed
  when: ansible_facts['os_family'] == "Darwin"

- name: Download session-manager-plugin pkg (macOS)
  get_url:
    url: "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/mac{{ '_arm64' if ansible_facts['architecture'] == 'arm64' else '' }}/session-manager-plugin.pkg"
    dest: /tmp/session-manager-plugin.pkg
    mode: '0644'
  when: ansible_facts['os_family'] == "Darwin" and not smp_installed.stat.exists

- name: Install session-manager-plugin (macOS)
  command: installer -pkg /tmp/session-manager-plugin.pkg -target /
  become: true
  when: ansible_facts['os_family'] == "Darwin" and not smp_installed.stat.exists

- name: Check if colima default instance exists
  shell: colima list -j | grep -q '"name":"default"'
  register: colima_instance
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == "Darwin"

- name: Create colima instance with vz backend
  shell: colima start --vm-type vz --vz-rosetta --mount-type virtiofs
  when: ansible_facts['os_family'] == "Darwin" and colima_instance.rc != 0

- name: Check if colima is already running
  shell: colima list -j | grep -q '"status":"Running"'
  register: colima_status
  failed_when: false
  changed_when: false
  when: ansible_facts['os_family'] == "Darwin" and colima_instance.rc == 0

- name: Start colima if not already running
  shell: colima start
  when: ansible_facts['os_family'] == "Darwin" and colima_instance.rc == 0 and colima_status.rc != 0

- name: Enable colima as a service to survive reboots
  shell: brew services start colima
  when: ansible_facts['os_family'] == "Darwin"

- name: Create Docker CLI plugins directory if not present
  file:
    path: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins"
    state: directory
    mode: '0755'
  when: ansible_facts['os_family'] == "Darwin"

- name: Symlink Docker Buildx plugin
  file:
    src: "{{ lookup('pipe', 'brew --prefix') }}/opt/docker-buildx/bin/docker-buildx"
    dest: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins/docker-buildx"
    state: link
    force: yes
  when: ansible_facts['os_family'] == "Darwin"

- name: Symlink Docker Compose plugin
  file:
    src: "{{ lookup('pipe', 'brew --prefix') }}/opt/docker-compose/bin/docker-compose"
    dest: "{{ ansible_facts.env.HOME }}/.docker/cli-plugins/docker-compose"
    state: link
    force: yes
  when: ansible_facts['os_family'] == "Darwin"

- name: Install task on Debian
  get_url:
    url: https://taskfile.dev/install.sh
    dest: /tmp/task-install.sh
    mode: '0755'
  when: ansible_facts['os_family'] == "Debian"

- name: Run task installer on Debian
  command: /tmp/task-install.sh -d -b /usr/local/bin
  args:
    creates: /usr/local/bin/task
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Install aws-vault on Debian
  get_url:
    url: https://github.com/99designs/aws-vault/releases/latest/download/aws-vault-linux-amd64
    dest: /usr/local/bin/aws-vault
    mode: 0755
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Set AWS CLI architecture on Debian
  set_fact:
    awscli_arch: "{{ 'x86_64' if ansible_facts['architecture'] == 'x86_64' else 'aarch64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else ansible_facts['architecture'] }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Download AWS CLI installer on Debian
  get_url:
    url: "https://awscli.amazonaws.com/awscli-exe-linux-{{ awscli_arch }}.zip"
    dest: /tmp/awscliv2.zip
    mode: '0644'
  when: ansible_facts['os_family'] == "Debian"

- name: Unpack AWS CLI installer on Debian
  unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Install AWS CLI on Debian
  command: /tmp/aws/install --update
  when: ansible_facts['os_family'] == "Debian"
  become: yes

- name: Ensure Claude Code directories exist
  file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ dotfiles_user_home }}/.claude"
    - "{{ dotfiles_user_home }}/.claude/hooks"

- name: Install Claude Code
  shell: curl -fsSL https://claude.ai/install.sh | bash

- name: Install OpenCode
  shell: curl -fsSL https://opencode.ai/install | bash

- name: Install Claude Code safety hook
  copy:
    src: claude/hooks/deny-rm-rf.jq
    dest: "{{ dotfiles_user_home }}/.claude/hooks/deny-rm-rf.jq"
    mode: '0755'

- name: Add current user to groups on Debian
  user:
    name: "{{ansible_facts.env.USER}}"
    groups: sudo,docker
    append: yes
  when: ansible_facts['os_family'] == "Debian"
  become: yes
