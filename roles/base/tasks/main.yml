  apt:
    name:
      - age
      - ansible
      - autoconf
      - bat
      - build-essential
      - ca-certificates
      - containerd.io
      - coreutils
      - curl
      - direnv
      - dirmngr
      - docker-ce
      - docker-ce-cli
      - docker-buildx-plugin
      - docker-compose-plugin
      - eza
      - fd-find
      - fonts-firacode
      - fzf
      - gawk
      - gh
      - gnupg
      - git
      - golang-go
      - gpg
      - htop
      - jq
      - keychain
      - libdb-dev
      - libffi-dev
      - libgdbm6
      - libgdbm-dev
      - libgmp-dev
      - liblzma-dev
      - libncurses5-dev
      - libncurses-dev
      - libpq-dev
      - libreadline6-dev
      - libsqlite3-dev
      - libssl-dev
      - libtool
      - libxml2-dev
      - libxmlsec1-dev
      - libyaml-dev
      - libbz2-dev
      - make
      - memcached
      - mise
      - neovim
      - openssl
      - patch
      - pgcli
      - pkg-config
      - postgresql
      - postgresql-client
      - pre-commit
      - python-is-python3
      - python3-psycopg2
      - redis
      - ripgrep
      - rustc
      - shellcheck
      - tofu
      - tealdeer
      - tk-dev
      - tmux
      - traceroute
      - tree
      - trash-cli
