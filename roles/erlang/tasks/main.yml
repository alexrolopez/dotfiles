- name: Select Erlang wxWidgets package on Debian
  set_fact:
    erlang_wxwidgets_package: "{{ 'libwxgtk3.0-gtk3-dev' if ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] is version('24.04', '<') else 'libwxgtk3.2-dev' }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Install erlang dependencies
  package:
    name: "{{ item }}"
    state: present
  become: true
  with_items:
    - autoconf
    - build-essential
    - default-jdk
    - fop
    - libgl1-mesa-dev
    - libglu1-mesa-dev
    - libncurses5-dev
    - libncurses-dev
    - libpng-dev
    - libssh-dev
    - "{{ erlang_wxwidgets_package }}"
    - unixodbc-dev
    - xsltproc
    - libxml2-utils
  when: ansible_facts['os_family'] == "Debian"

- name: Install erlang dependencies (macOS)
  homebrew:
    name: "{{ item }}"
    state: present
  with_items:
    - autoconf
    - fop
    - libxslt
    - openssl
    - wxwidgets
  when: ansible_facts['os_family'] == "Darwin"

- name: Install erlang versions
  shell: mise install erlang@{{item}}
  args:
    executable: /bin/bash
  loop: "{{versions}}"

- name: Set global version for erlang to {{versions[0]}}
  shell: mise use -g erlang@{{versions[0]}}
  args:
    executable: /bin/bash
